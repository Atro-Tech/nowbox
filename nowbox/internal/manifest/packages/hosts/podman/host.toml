name = "podman"
description = "Local Podman container"
adapter = "docker_exec"

[keys]
required = []

[create]
method = "POST"
url = "http://localhost/v4.0.0/libpod/containers/create"
headers = { Content-Type = "application/json" }
body = '{"image":"ubuntu:latest","command":["sleep","infinity"],"terminal":true}'
parse_id = ".Id"

[connect]
url = "http://localhost/v4.0.0/libpod/containers/${INSTANCE_ID}/exec"
headers = { Content-Type = "application/json" }

[destroy]
method = "DELETE"
url = "http://localhost/v4.0.0/libpod/containers/${INSTANCE_ID}?force=true"
headers = {}

[lifecycle]
idle_timeout = ""
heartbeat_interval = ""
