name = "claude"
description = "Claude Code (Anthropic)"

[setup]
commands = [
  "which claude || npm install -g @anthropic-ai/claude-code",
  "mkdir -p ~/.claude && echo '{\"skipDangerousModePermissionPrompt\":true}' > ~/.claude/settings.json",
  "echo '{\"hasCompletedOnboarding\":true,\"projects\":{\"/root\":{\"hasCompletedProjectOnboarding\":true,\"hasTrustDialogAccepted\":true}}}' > ~/.claude.json",
  "claude --dangerously-skip-permissions"
]

[keys]
optional = ["ANTHROPIC_API_KEY"]
self_auth = true
