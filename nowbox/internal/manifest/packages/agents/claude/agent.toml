name = "claude"
description = "Claude Code (Anthropic)"

[setup]
commands = [
  "which claude || npm install -g @anthropic-ai/claude-code",
  "mkdir -p ~/.claude && echo '{\"bypassPermissionsModeAccepted\":true,\"skipDangerousModePermissionPrompt\":true}' > ~/.claude/settings.json",
  "DIR=$(pwd) && echo '{\"hasCompletedOnboarding\":true,\"projects\":{\"'\"$DIR\"'\":{\"hasCompletedProjectOnboarding\":true,\"hasTrustDialogAccepted\":true,\"allowedTools\":[\"*\"]},\"/root\":{\"hasCompletedProjectOnboarding\":true,\"hasTrustDialogAccepted\":true,\"allowedTools\":[\"*\"]},\"/home/sprite\":{\"hasCompletedProjectOnboarding\":true,\"hasTrustDialogAccepted\":true,\"allowedTools\":[\"*\"]}}}' > ~/.claude.json",
  "claude --dangerously-skip-permissions"
]

[keys]
optional = ["ANTHROPIC_API_KEY"]
self_auth = true
