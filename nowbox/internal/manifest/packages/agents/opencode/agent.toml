name = "opencode"
description = "OpenCode (terminal coding agent)"

[setup]
commands = [
  "which opencode || (curl -fsSL https://opencode.ai/install | bash && export PATH=\"$HOME/.local/bin:$PATH\")",
  "export PATH=\"$HOME/.local/bin:$PATH\" && opencode"
]

[keys]
optional = ["ANTHROPIC_API_KEY", "OPENAI_API_KEY"]
self_auth = true
