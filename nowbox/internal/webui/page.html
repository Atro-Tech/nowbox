<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><style>path%7Bstroke:%23111%7D@media(prefers-color-scheme:dark)%7Bpath%7Bstroke:%23fff%7D%7D</style><path d='M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z'/><path d='m3.3 7 8.7 5 8.7-5'/><path d='M12 22V12'/></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; display: flex; flex-direction: column; height: 100vh; }
  #header {
    padding: 6px 16px;
    background: #1a1a1a;
    border-bottom: 1px solid #333;
    font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
    font-size: 12px;
    color: #888;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  #header .name { color: #eee; }
  #header .sep { color: #333; }
  #header .spacer { flex: 1; }
  .header-btn {
    font-family: inherit;
    font-size: 11px;
    padding: 2px 8px;
    background: transparent;
    color: #555;
    border: 1px solid #333;
    cursor: pointer;
    text-decoration: none;
  }
  .header-btn:hover { color: #aaa; border-color: #aaa; }
  #quit:hover { color: #f66; border-color: #f66; }
  #terminal { flex: 1; }
</style>
</head>
<body>
<div id="header">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
  <span style="color:#555">nowbox {{VERSION}}</span>
  <span class="sep">│</span>
  <span class="name">{{SESSION}}</span>
  <span class="sep">│</span>
  <span>{{HOST_AGENT}}</span>
  <span class="spacer"></span>
  <a class="header-btn" href="{{SAVE_PATH}}" download>save</a>
  <button id="quit" class="header-btn" onclick="doQuit()">quit</button>
</div>
<div id="terminal"></div>

<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
<script>
var term = new Terminal({
  cursorBlink: true,
  fontSize: 14,
  fontFamily: "'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace",
  theme: { background: '#0a0a0a', foreground: '#eee' }
});
var fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));
fitAddon.fit();

var ws = new WebSocket('ws://' + location.host + '{{WS_PATH}}');
ws.binaryType = 'arraybuffer';

ws.onopen = function() {
  // Send initial size
  ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
  // Re-send after Claude starts to fix layout
  setTimeout(function() {
    fitAddon.fit();
    ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
  }, 3000);
};

ws.onmessage = function(e) {
  if (e.data instanceof ArrayBuffer) {
    term.write(new Uint8Array(e.data));
  }
};

ws.onclose = function() {
  window.close();
  // window.close() only works if the page was opened by script (window.open).
  // For tabs opened via OS "open" command, show disconnected message as fallback.
  term.write('\r\n\x1b[90m[disconnected — you can close this tab]\x1b[0m\r\n');
  document.getElementById('quit').textContent = 'closed';
};

function doQuit() {
  ws.close();
}

term.onData(function(data) {
  if (ws.readyState === 1) {
    var enc = new TextEncoder();
    ws.send(enc.encode(data));
  }
});

window.addEventListener('resize', function() {
  fitAddon.fit();
  if (ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
  }
});
</script>
</body>
</html>
