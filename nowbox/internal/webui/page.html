<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; display: flex; flex-direction: column; height: 100vh; }
  #header {
    padding: 6px 16px;
    background: #1a1a1a;
    border-bottom: 1px solid #333;
    font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
    font-size: 12px;
    color: #888;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  #header .name { color: #eee; }
  #header .sep { color: #333; }
  #header .spacer { flex: 1; }
  #quit {
    font-family: inherit;
    font-size: 11px;
    padding: 2px 8px;
    background: transparent;
    color: #555;
    border: 1px solid #333;
    cursor: pointer;
  }
  #quit:hover { color: #f66; border-color: #f66; }
  #terminal { flex: 1; }
</style>
</head>
<body>
<div id="header">
  <span class="name">{{SESSION}}</span>
  <span class="sep">│</span>
  <span>{{HOST_AGENT}}</span>
  <span class="spacer"></span>
  <button id="quit" onclick="doQuit()">quit</button>
</div>
<div id="terminal"></div>

<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
<script>
var term = new Terminal({
  cursorBlink: true,
  fontSize: 14,
  fontFamily: "'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace",
  theme: { background: '#0a0a0a', foreground: '#eee' }
});
var fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));
fitAddon.fit();

var ws = new WebSocket('ws://' + location.host + '{{WS_PATH}}');
ws.binaryType = 'arraybuffer';

ws.onopen = function() {
  // Send initial size
  ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
};

ws.onmessage = function(e) {
  if (e.data instanceof ArrayBuffer) {
    term.write(new Uint8Array(e.data));
  }
};

ws.onclose = function() {
  term.write('\r\n\x1b[90m[disconnected]\x1b[0m\r\n');
  document.getElementById('quit').textContent = 'closed';
};

function doQuit() {
  ws.close();
}

term.onData(function(data) {
  if (ws.readyState === 1) {
    var enc = new TextEncoder();
    ws.send(enc.encode(data));
  }
});

window.addEventListener('resize', function() {
  fitAddon.fit();
  if (ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
  }
});
</script>
</body>
</html>
