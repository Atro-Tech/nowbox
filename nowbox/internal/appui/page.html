<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><style>path%7Bstroke:%23111%7D@media(prefers-color-scheme:dark)%7Bpath%7Bstroke:%23fff%7D%7D</style><path d='M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z'/><path d='m3.3 7 8.7 5 8.7-5'/><path d='M12 22V12'/></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
    height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    color: #eee;
  }

  /* ── Header ── */
  #header {
    padding: 6px 16px;
    background: #1a1a1a;
    border-bottom: 1px solid #333;
    font-size: 12px;
    color: #888;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
    font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
  }
  #header .name { color: #eee; }
  #header .sep { color: #333; }
  #header .spacer { flex: 1; }

  .header-btn {
    font-family: inherit;
    font-size: 11px;
    padding: 2px 8px;
    background: transparent;
    color: #555;
    border: 1px solid #333;
    cursor: pointer;
    text-decoration: none;
  }
  .header-btn:hover { color: #aaa; border-color: #aaa; }

  /* ── Tab switcher ── */
  .tab-group {
    display: flex;
    gap: 0;
  }
  .tab-btn {
    font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
    font-size: 11px;
    padding: 2px 10px;
    background: transparent;
    color: #555;
    border: 1px solid #333;
    cursor: pointer;
  }
  .tab-btn:first-child { border-radius: 3px 0 0 3px; }
  .tab-btn:last-child { border-radius: 0 3px 3px 0; border-left: none; }
  .tab-btn:hover { color: #aaa; }
  .tab-btn.active {
    background: #2a2a2a;
    color: #eee;
    border-color: #555;
  }

  /* ── Views ── */
  #chat-view {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #tty-view {
    flex: 1;
    display: none;
  }

  /* ── Chat ── */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .message {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .message.user {
    align-self: flex-end;
    background: #2563eb;
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .message.agent {
    align-self: flex-start;
    background: #1e1e1e;
    color: #ddd;
    border: 1px solid #333;
    border-bottom-left-radius: 4px;
    font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
    font-size: 13px;
  }

  .message.system {
    align-self: center;
    color: #666;
    font-size: 12px;
    font-style: italic;
  }

  /* ── Input bar ── */
  #input-bar {
    padding: 12px 16px;
    background: #141414;
    border-top: 1px solid #333;
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  #input-bar textarea {
    flex: 1;
    background: #1e1e1e;
    color: #eee;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 10px 14px;
    font-family: inherit;
    font-size: 14px;
    resize: none;
    outline: none;
    line-height: 1.4;
    min-height: 20px;
    max-height: 120px;
  }
  #input-bar textarea:focus { border-color: #555; }
  #input-bar textarea::placeholder { color: #555; }

  #send-btn {
    align-self: flex-end;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
  }
  #send-btn:hover { background: #1d4ed8; }
  #send-btn:disabled { opacity: 0.4; cursor: default; }

  /* ── Scrollbar ── */
  #messages::-webkit-scrollbar { width: 6px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
</style>
</head>
<body>

<div id="header">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
  <span style="color:#555">nowbox {{VERSION}}</span>
  <span class="sep">|</span>
  <span class="name">{{SESSION}}</span>
  <span class="sep">|</span>
  <span>{{HOST_AGENT}}</span>
  <span class="spacer"></span>
  <a class="header-btn" href="{{SAVE_PATH}}" download>save</a>
  <div class="tab-group">
    <button class="tab-btn active" onclick="switchTab('chat')">chat</button>
    <button class="tab-btn" onclick="switchTab('tty')">tty</button>
  </div>
</div>

<!-- Chat view -->
<div id="chat-view">
  <div id="messages">
    <div class="message system">connected</div>
  </div>
  <div id="input-bar">
    <textarea id="chat-input" rows="1" placeholder="Send a message..." autofocus></textarea>
    <button id="send-btn" onclick="sendChat()">Send</button>
  </div>
</div>

<!-- TTY view -->
<div id="tty-view"></div>

<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
<script>
// ── State ──
var currentTab = 'chat';
var ws;
var term;
var fitAddon;
var ttyInitialized = false;

// Buffer for agent output that arrives while in chat mode
var agentBuffer = '';
var agentFlushTimer = null;

// ── WebSocket ──
ws = new WebSocket('ws://' + location.host + '{{WS_PATH}}');
ws.binaryType = 'arraybuffer';

ws.onopen = function() {
  // Send initial size (use reasonable defaults for chat mode)
  ws.send(JSON.stringify({ type: 'resize', cols: 80, rows: 24 }));
};

ws.onmessage = function(e) {
  if (!(e.data instanceof ArrayBuffer)) return;

  var text = new TextDecoder().decode(new Uint8Array(e.data));

  // Always feed raw data to xterm if initialized
  if (term) {
    term.write(new Uint8Array(e.data));
  }

  // Buffer output for chat view
  agentBuffer += text;
  clearTimeout(agentFlushTimer);
  agentFlushTimer = setTimeout(flushAgentBuffer, 150);
};

ws.onclose = function() {
  addMessage('system', 'disconnected');
  if (term) {
    term.write('\r\n\x1b[90m[disconnected]\x1b[0m\r\n');
  }
  document.getElementById('send-btn').disabled = true;
  document.getElementById('chat-input').disabled = true;
};

// ── Chat ──
function flushAgentBuffer() {
  if (!agentBuffer) return;

  // Strip ANSI escape sequences for chat display
  var clean = stripAnsi(agentBuffer);
  agentBuffer = '';

  clean = clean.trim();
  if (!clean) return;

  addMessage('agent', clean);
}

function stripAnsi(str) {
  return str.replace(/\x1b\[[0-9;]*[a-zA-Z]/g, '')
            .replace(/\x1b\][^\x07]*\x07/g, '')
            .replace(/\x1b[()][0-9A-B]/g, '')
            .replace(/\r/g, '');
}

function addMessage(type, text) {
  var container = document.getElementById('messages');
  var div = document.createElement('div');
  div.className = 'message ' + type;
  div.textContent = text;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function sendChat() {
  var input = document.getElementById('chat-input');
  var text = input.value.trim();
  if (!text || ws.readyState !== 1) return;

  addMessage('user', text);
  input.value = '';
  input.style.height = 'auto';

  // Send as raw text to the PTY (with newline to execute)
  var enc = new TextEncoder();
  ws.send(enc.encode(text + '\n'));
}

// Auto-resize textarea
var chatInput = document.getElementById('chat-input');
chatInput.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

chatInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendChat();
  }
});

// ── TTY ──
function initTTY() {
  if (ttyInitialized) return;
  ttyInitialized = true;

  term = new Terminal({
    cursorBlink: true,
    fontSize: 14,
    fontFamily: "'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace",
    theme: { background: '#0a0a0a', foreground: '#eee' }
  });
  fitAddon = new FitAddon.FitAddon();
  term.loadAddon(fitAddon);
  term.open(document.getElementById('tty-view'));

  term.onData(function(data) {
    if (ws.readyState === 1) {
      var enc = new TextEncoder();
      ws.send(enc.encode(data));
    }
  });
}

// ── Tab switching ──
function switchTab(tab) {
  currentTab = tab;

  // Update tab buttons
  var buttons = document.querySelectorAll('.tab-btn');
  buttons.forEach(function(btn) {
    btn.classList.toggle('active', btn.textContent === tab);
  });

  var chatView = document.getElementById('chat-view');
  var ttyView = document.getElementById('tty-view');

  if (tab === 'chat') {
    chatView.style.display = 'flex';
    ttyView.style.display = 'none';
    document.getElementById('chat-input').focus();
  } else {
    chatView.style.display = 'none';
    ttyView.style.display = 'block';

    // Lazy-init xterm on first switch
    initTTY();

    // Fit after display change
    setTimeout(function() {
      fitAddon.fit();
      if (ws.readyState === 1) {
        ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
      }
      term.focus();
    }, 0);
  }
}

window.addEventListener('resize', function() {
  if (currentTab === 'tty' && fitAddon) {
    fitAddon.fit();
    if (ws.readyState === 1) {
      ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
    }
  }
});
</script>
</body>
</html>
