<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><style>path%7Bstroke:%23111%7D@media(prefers-color-scheme:dark)%7Bpath%7Bstroke:%23fff%7D%7D</style><path d='M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z'/><path d='m3.3 7 8.7 5 8.7-5'/><path d='M12 22V12'/></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/marked@15.0.0/lib/marked.min.js">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a1a;
    display: flex;
    flex-direction: column;
    height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    color: #e0e0e0;
  }

  /* ── Header ── */
  #header {
    padding: 10px 20px;
    background: #1a1a1a;
    border-bottom: 1px solid #2a2a2a;
    font-size: 13px;
    color: #888;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  #header .name { color: #e0e0e0; font-weight: 500; }
  #header .sep { color: #333; }
  #header .spacer { flex: 1; }
  .header-btn {
    font-family: inherit;
    font-size: 12px;
    padding: 4px 12px;
    background: transparent;
    color: #666;
    border: 1px solid #333;
    border-radius: 6px;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.15s;
  }
  .header-btn:hover { color: #aaa; border-color: #555; }

  .tab-group { display: flex; gap: 0; }
  .tab-btn {
    font-family: inherit;
    font-size: 12px;
    padding: 4px 14px;
    background: transparent;
    color: #666;
    border: 1px solid #333;
    cursor: pointer;
    transition: all 0.15s;
  }
  .tab-btn:first-child { border-radius: 6px 0 0 6px; }
  .tab-btn:last-child { border-radius: 0 6px 6px 0; border-left: none; }
  .tab-btn:hover { color: #aaa; }
  .tab-btn.active { background: #2a2a2a; color: #e0e0e0; border-color: #444; }

  /* ── Chat view ── */
  #chat-view {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .msg { display: flex; gap: 14px; align-items: flex-start; }
  .msg-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 600;
  }
  .msg.user .msg-avatar { background: #2563eb; color: #fff; }
  .msg.agent .msg-avatar { background: #d4a574; color: #1a1a1a; }
  .msg-body {
    flex: 1;
    min-width: 0;
  }
  .msg-role {
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 4px;
    color: #999;
  }
  .msg-content {
    font-size: 14px;
    line-height: 1.7;
    color: #ddd;
    word-wrap: break-word;
  }
  .msg-content code {
    background: #2a2a2a;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
    font-size: 13px;
  }
  .msg-content pre {
    background: #111;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    padding: 14px;
    margin: 8px 0;
    overflow-x: auto;
    font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
    font-size: 13px;
    line-height: 1.5;
  }
  .msg-content pre code {
    background: none;
    padding: 0;
  }
  .msg.system { justify-content: center; }
  .msg.system .msg-content {
    color: #555;
    font-size: 12px;
    text-align: center;
  }

  .typing-indicator {
    display: inline-flex;
    gap: 4px;
    padding: 4px 0;
  }
  .typing-indicator span {
    width: 6px;
    height: 6px;
    background: #555;
    border-radius: 50%;
    animation: typing 1.2s ease-in-out infinite;
  }
  .typing-indicator span:nth-child(2) { animation-delay: 0.15s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typing {
    0%, 60%, 100% { opacity: 0.3; transform: scale(0.8); }
    30% { opacity: 1; transform: scale(1); }
  }

  /* ── Input ── */
  #input-bar {
    padding: 16px 20px 20px;
    flex-shrink: 0;
  }
  #input-wrap {
    background: #222;
    border: 1px solid #333;
    border-radius: 24px;
    display: flex;
    align-items: flex-end;
    padding: 6px 6px 6px 18px;
    transition: border-color 0.15s;
  }
  #input-wrap:focus-within { border-color: #555; }
  #input-wrap textarea {
    flex: 1;
    background: none;
    color: #e0e0e0;
    border: none;
    font-family: inherit;
    font-size: 15px;
    resize: none;
    outline: none;
    line-height: 1.5;
    padding: 8px 0;
    min-height: 24px;
    max-height: 150px;
  }
  #input-wrap textarea::placeholder { color: #555; }
  #send-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #d4a574;
    color: #1a1a1a;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  #send-btn:hover { background: #e0b688; }
  #send-btn:disabled { opacity: 0.3; cursor: default; }
  #send-btn svg { width: 18px; height: 18px; }

  /* ── TTY view ── */
  #tty-view { flex: 1; display: none; }

  /* ── Scrollbar ── */
  #messages::-webkit-scrollbar { width: 6px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
</style>
</head>
<body>

<div id="header">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d4a574" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
  <span class="name">{{SESSION}}</span>
  <span style="color:#555; font-size:11px">{{VERSION}}</span>
  <span class="spacer"></span>
  <a class="header-btn" href="{{SAVE_PATH}}" download>save</a>
  <div class="tab-group">
    <button class="tab-btn active" onclick="switchTab('chat')">chat</button>
    <button class="tab-btn" onclick="switchTab('terminal')">terminal</button>
  </div>
</div>

<div id="chat-view">
  <div id="messages"></div>
  <div id="input-bar">
    <div id="input-wrap">
      <textarea id="chat-input" rows="1" placeholder="Message Claude..."></textarea>
      <button id="send-btn" onclick="sendChat()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>
</div>

<div id="tty-view"></div>

<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
<script>
var currentTab = 'chat';
var ws, term, fitAddon;
var ttyInitialized = false;
var setupDone = false;

// Track conversation state
var agentBuffer = '';
var agentFlushTimer = null;
var isAgentTyping = false;
var currentAgentMsg = null;
var ignoreOutput = true; // ignore setup command output

// ANSI stripping
function stripAnsi(s) {
  return s
    .replace(/\x1b\[\??[0-9;]*[a-zA-Z]/g, '')
    .replace(/\x1b\][^\x07\x1b]*[\x07]/g, '')
    .replace(/\x1b\][^\x07\x1b]*\x1b\\/g, '')
    .replace(/\x1b[()][0-9A-B]/g, '')
    .replace(/\x07/g, '')
    .replace(/\r/g, '');
}

// Detect when Claude Code is ready (prompt appears)
function isPromptLine(text) {
  return /[❯>]\s*$/.test(text.trim()) || /^\s*❯/.test(text);
}

// Detect setup noise
function isSetupNoise(text) {
  var noise = ['which claude', 'npm install', 'mkdir -p', 'printf', 'stty', 'claude.json',
    'settings.json', 'skipDangerousMode', 'hasCompleted', 'hasTrust', 'spin()', 'SPIN=',
    'nowbox is loading', 'launching claude', '/home/sprite', '/home/user', '/root',
    'dangerously-skip', 'Loading conversations', '?2004', '?1004', '?2031', '?25',
    '?2026', 'Resume Session', 'Search'];
  for (var i = 0; i < noise.length; i++) {
    if (text.indexOf(noise[i]) !== -1) return true;
  }
  return false;
}

function addMsg(type, content) {
  var container = document.getElementById('messages');
  var div = document.createElement('div');
  div.className = 'msg ' + type;

  if (type === 'system') {
    div.innerHTML = '<div class="msg-content">' + escapeHtml(content) + '</div>';
  } else {
    var avatar = type === 'user' ? 'Y' : '✦';
    var role = type === 'user' ? 'You' : 'Claude';
    div.innerHTML =
      '<div class="msg-avatar">' + avatar + '</div>' +
      '<div class="msg-body">' +
        '<div class="msg-role">' + role + '</div>' +
        '<div class="msg-content">' + formatContent(content) + '</div>' +
      '</div>';
  }

  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return div;
}

function updateAgentMsg(content) {
  if (!currentAgentMsg) {
    currentAgentMsg = addMsg('agent', content);
  } else {
    var el = currentAgentMsg.querySelector('.msg-content');
    if (el) el.innerHTML = formatContent(content);
    var container = document.getElementById('messages');
    container.scrollTop = container.scrollHeight;
  }
}

function formatContent(text) {
  // Simple markdown-ish rendering
  text = escapeHtml(text);
  // Code blocks
  text = text.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  // Inline code
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Bold
  text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  // Line breaks
  text = text.replace(/\n/g, '<br>');
  return text;
}

function escapeHtml(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function showTyping() {
  if (isAgentTyping) return;
  isAgentTyping = true;
  var container = document.getElementById('messages');
  var div = document.createElement('div');
  div.className = 'msg agent';
  div.id = 'typing-msg';
  div.innerHTML =
    '<div class="msg-avatar">✦</div>' +
    '<div class="msg-body">' +
      '<div class="msg-role">Claude</div>' +
      '<div class="typing-indicator"><span></span><span></span><span></span></div>' +
    '</div>';
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function hideTyping() {
  isAgentTyping = false;
  var el = document.getElementById('typing-msg');
  if (el) el.remove();
}

// Accumulate and flush agent output
var fullAgentResponse = '';

function flushAgentBuffer() {
  if (!agentBuffer) return;
  var raw = agentBuffer;
  agentBuffer = '';

  var clean = stripAnsi(raw).trim();
  if (!clean) return;

  // Skip setup noise
  if (ignoreOutput && isSetupNoise(clean)) return;

  // Detect when Claude's prompt appears (setup done, ready for input)
  if (ignoreOutput && isPromptLine(clean)) {
    ignoreOutput = false;
    return;
  }

  if (ignoreOutput) return;

  // If it's a prompt line, finalize current response
  if (isPromptLine(clean)) {
    if (fullAgentResponse) {
      hideTyping();
      updateAgentMsg(fullAgentResponse.trim());
      currentAgentMsg = null;
      fullAgentResponse = '';
    }
    return;
  }

  // Accumulate response
  hideTyping();
  fullAgentResponse += clean + '\n';
  updateAgentMsg(fullAgentResponse.trim());
}

// WebSocket
ws = new WebSocket('ws://' + location.host + '{{WS_PATH}}');
ws.binaryType = 'arraybuffer';

ws.onopen = function() {
  ws.send(JSON.stringify({ type: 'resize', cols: 100, rows: 40 }));
  setTimeout(function() {
    ws.send(JSON.stringify({ type: 'resize', cols: 100, rows: 40 }));
  }, 3000);
};

ws.onmessage = function(e) {
  if (!(e.data instanceof ArrayBuffer)) return;
  var bytes = new Uint8Array(e.data);
  if (term) term.write(bytes);

  var text = new TextDecoder().decode(bytes);
  agentBuffer += text;
  clearTimeout(agentFlushTimer);
  agentFlushTimer = setTimeout(flushAgentBuffer, 200);
};

ws.onclose = function() {
  addMsg('system', 'disconnected');
  document.getElementById('send-btn').disabled = true;
  document.getElementById('chat-input').disabled = true;
};

// Chat input
function sendChat() {
  var input = document.getElementById('chat-input');
  var text = input.value.trim();
  if (!text || ws.readyState !== 1) return;

  // Finalize any pending agent response
  if (fullAgentResponse) {
    hideTyping();
    updateAgentMsg(fullAgentResponse.trim());
    currentAgentMsg = null;
    fullAgentResponse = '';
  }

  addMsg('user', text);
  showTyping();
  input.value = '';
  input.style.height = 'auto';

  var enc = new TextEncoder();
  ws.send(enc.encode(text + '\n'));
}

var chatInput = document.getElementById('chat-input');
chatInput.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 150) + 'px';
});
chatInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendChat();
  }
});

// TTY
function initTTY() {
  if (ttyInitialized) return;
  ttyInitialized = true;
  term = new Terminal({
    cursorBlink: true,
    fontSize: 14,
    fontFamily: "'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace",
    theme: { background: '#1a1a1a', foreground: '#e0e0e0' }
  });
  fitAddon = new FitAddon.FitAddon();
  term.loadAddon(fitAddon);
  term.open(document.getElementById('tty-view'));
  term.onData(function(data) {
    if (ws.readyState === 1) {
      var enc = new TextEncoder();
      ws.send(enc.encode(data));
    }
  });
}

// Tab switching
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(function(btn) {
    btn.classList.toggle('active', btn.textContent === tab);
  });
  var chatView = document.getElementById('chat-view');
  var ttyView = document.getElementById('tty-view');

  if (tab === 'chat') {
    chatView.style.display = 'flex';
    ttyView.style.display = 'none';
    document.getElementById('chat-input').focus();
  } else {
    chatView.style.display = 'none';
    ttyView.style.display = 'block';
    initTTY();
    setTimeout(function() {
      fitAddon.fit();
      if (ws.readyState === 1) {
        ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
      }
      term.focus();
    }, 0);
  }
}

window.addEventListener('resize', function() {
  if (currentTab === 'terminal' && fitAddon) {
    fitAddon.fit();
    if (ws.readyState === 1) {
      ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
    }
  }
});

// Focus input on load
chatInput.focus();
</script>
</body>
</html>
